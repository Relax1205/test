<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Тест по РБД</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Тест по РБД</h1>
    <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Переключить тему">
      <span class="sun-icon">☀️</span>
      <span class="moon-icon">🌙</span>
    </button>
  </header>

  <div id="score">Пройдено вопросов: 0 / 0</div>

  <div id="quiz-controls">
    <button onclick="startQuiz()">Основной тест</button>
    <button onclick="showWrong()">Повторить ошибки</button>
  </div>

  <div id="quiz"></div>

  <script src="questions.js"></script>
  <script src="script.js"></script>
</body>
</html>
